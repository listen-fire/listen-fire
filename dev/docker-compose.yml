version: "3.6"
services:
  postgres:
    container_name: postgres_listenfire
    build:
      context: ..
      dockerfile: dev/Dockerfile
    volumes:
      - listenfire-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: listenfire
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: listenfire
    ports:
      - 9432:5432

  redis:
    image: redis:7.2-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
volumes:
  listenfire-postgres:
  redis:
    driver: local

version: "3.6"
# Container names are parameterized on $LISTEN_FIRE_STACK so two checkouts on
# the same machine (a fork, a second clone) never collide on the same
# Postgres/Redis containers. dev/loop.sh exports it, and also passes it as
# `docker compose -p`, before every `docker compose` call — defaulting to
# `listenfire-<repo dir basename>` (the compose project name itself must come
# from `-p` on the command line rather than a top-level `name:` field here:
# older Docker Compose does not interpolate `${VAR}` in that field, so it
# would render literally instead of varying per checkout). Set
# $LISTEN_FIRE_STACK yourself if you drive this file directly. Host ports
# come from $POSTGRES_HOST_PORT / $REDIS_HOST_PORT (defaulting to 9432/6379,
# the developer stack's fixed ports) so a profile that wants its own isolated
# datastore — the `agent` profile, see dev/loop.sh — can claim different ones
# instead of fighting the developer's stack, or an unrelated compose project
# on the same host, for the default ports.
services:
  postgres:
    container_name: ${LISTEN_FIRE_STACK}-postgres
    build:
      context: ..
      dockerfile: dev/Dockerfile
    volumes:
      - listenfire-postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: listenfire
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: listenfire
    ports:
      - "${POSTGRES_HOST_PORT:-9432}:5432"

  redis:
    container_name: ${LISTEN_FIRE_STACK}-redis
    image: redis:7.2-alpine
    restart: always
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    command: redis-server --save 60 1 --loglevel warning
volumes:
  listenfire-postgres:
  redis:
    driver: local

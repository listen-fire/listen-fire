engine: 0.12.0
movements: movements
externals: externals
# The movement's own update comes back from Attio as record.updated. With this
# guard in the loopGuard slot (empty by default) listen-fire knows that echo and runs
# nothing; without it the echo runs the movement again.
core:
  loopGuard: "@lf/fingerprint-guard"
# Where Attio reaches `listen-fire serve` (a tunnel to it, or a host). `listen-fire serve`
# registers Attio's webhook at <publicUrl>/api/public/webhook-sync/attio/<credential>.
# publicUrl: https://lf.example.com

[package]
name = "listen-fire-parser"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "The listen-fire movement language parser: source to AST, expression lowering and the catalog snapshot"
readme = "README.md"
keywords = ["movement", "automation", "dsl", "workflow", "listen-fire"]
categories = ["parser-implementations", "compilers"]
include = ["src/**/*", "Cargo.toml", "README.md"]

[lib]
name = "movement_parser"
# cdylib is the WASM artifact; rlib lets `cargo test` link the crate natively.
crate-type = ["cdylib", "rlib"]

# `gen-vocabulary` rewrites the lowering vocabulary's data.rs from its JSON
# (src/lowering/vocabulary/README.md). The feature keeps the binary out of
# every other build, the WASM's among them.
[features]
generate = []

[[bin]]
name = "gen-vocabulary"
path = "src/bin/gen-vocabulary.rs"
required-features = ["generate"]

[dependencies]
# The lowering's one data-ordered map (a hop's `extra` settings) keeps its
# insertion order, as the TypeScript object it is read as does.
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` stays off: serde_json's Map is then a BTreeMap, which is
# what makes `to_sorted_json` emit sorted keys.
# `float_roundtrip`: the lowering parses the tree's numbers, and the default
# parser can be one ULP off. `unbounded_depth`: a tree at the grammar's depth
# limit nests deeper than serde_json's default 128. `raw_value`: the catalog
# reads data maps straight from the text, since a `Value`'s map is sorted.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value", "unbounded_depth"] }


[package]
# Modules written in Rust: a trait per module kind, and the host process that
# serves them over adapter protocol 2 (HTTP on TCP or a Unix socket). A host
# never links into `lf`; lf speaks to it as to any other module server.
name = "listen-fire-module-kit"
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Write listen-fire modules (adapters, plugins, core slots) in Rust and serve them over adapter protocol 2"
keywords = ["movement", "automation", "listen-fire", "adapter", "module"]
categories = ["network-programming", "web-programming::http-server"]
include = ["src/**/*", "Cargo.toml"]

[lib]
name = "module_kit"

[dependencies]
module-wire = { package = "listen-fire-module-wire", version = "0.12.4", path = "../module-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value", "unbounded_depth"] }
# A wire object (`Obj`) inside a typed request or answer.
indexmap = { version = "2", features = ["serde"] }
# A host is one thread, as lf is: a module's futures need not be Send.
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "time"] }
# The client asks the host's limits door (src/host_limits.rs).
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
# A file's bytes on the ocr slot's wire (src/host_ocr.rs).
base64 = "0.22"

[dev-dependencies]
hyper = { version = "1", features = ["client", "server", "http1"] }

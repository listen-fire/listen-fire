[package]
# The facade: `cargo install listen-fire` installs the `lf` command, and the
# library re-exports the parser, checker and engine crates (src/lib.rs).
name = "listen-fire"
# The release version: a tag lf-v<version> must name it (lf-release.yml
# refuses a tag that does not), and `lf --version` prints it.
version.workspace = true
edition.workspace = true
publish = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "listen-fire: the movement language's parser, checker and engine, and the `lf` command that runs movements locally"
readme = "README.md"
keywords = ["movement", "automation", "dsl", "workflow", "listen-fire"]
categories = ["command-line-utilities", "compilers", "development-tools"]
include = ["src/**/*", "data/**/*", "Cargo.toml", "README.md"]

[lib]
name = "listen_fire"
path = "src/lib.rs"

# A native binary only: the WASM build names its packages (-p listen-fire-engine,
# -p listen-fire-parser), so this crate and its dependencies never enter it.
# Its dependencies are the `cli` feature's (on by default, so `cargo install`
# builds it): a library user takes `default-features = false` and gets the
# three re-exported crates alone.
[[bin]]
name = "lf"
path = "src/main.rs"
required-features = ["cli"]

[features]
# The `lf` command, in the pieces a light build can leave out. The default is
# the full `lf`; `--no-default-features --features cli` builds the light one
# (SQLite store, loopback and remote modules, no TLS stack, no provider
# client, no sign-in flow, no inbound doors), the host to embed or to run
# `lf check` and a manual run with. Each omitted piece refuses by name when a
# project asks for it.
default = ["cli", "anthropic", "oauth", "postgres", "serve", "pdf"]
cli = ["dep:module-wire", "dep:serde", "dep:serde_json", "dep:serde_yaml", "dep:indexmap", "dep:tokio", "dep:hyper", "dep:hyper-util", "dep:hmac", "dep:base64", "dep:http-body-util", "dep:bytes", "dep:rusqlite", "dep:getrandom", "dep:uuid", "dep:sha2", "dep:jiff", "dep:url"]
# HTTPS out, pure-Rust TLS: the pieces below that speak to a provider, a token
# endpoint or a database over TLS need it; nothing else does.
tls = ["dep:rustls", "dep:tokio-rustls", "dep:webpki-roots"]
# The Anthropic model client (src/anthropic.rs) and the model calls over it.
anthropic = ["cli", "tls"]
# The OAuth2 sign-in flows: authorize, redirect listener, code exchange, refresh.
oauth = ["cli", "tls"]
# The Postgres store, its TLS, and the fingerprint guard's Postgres memory.
postgres = ["cli", "tls", "dep:tokio-postgres"]
# The hyper server bits: `lf serve`, the inbound doors and their signature checks.
serve = ["cli", "hyper/server"]
# A PDF's own text layer (src/pdf_text.rs), read before the ocr slot is asked.
pdf = ["cli", "dep:lopdf", "dep:libc"]

# `cargo binstall listen-fire` fetches the release tarball (lf-release.yml's
# Archive step) instead of compiling; the tarball nests everything in one directory.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/lf-v{ version }/lf-v{ version }-{ target }.tar.gz"
bin-dir = "lf-v{ version }-{ target }/bin/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
movement-parser = { package = "listen-fire-parser", version = "0.12.1", path = "../movement-parser" }
# The checker with its native zone database: the same one the engine's
# artifact answers zones from.
movement-checker = { package = "listen-fire-checker", version = "0.12.1", path = "../movement-checker" }
# The engine, natively: a segment runs in this process, its requests served
# by the run host here (src/segment.rs), with the native environment
# services (zones, URLs, Unicode data) the engine's default feature links.
# The language service `lf lsp` serves (src/lsp.rs).
movement-language = { package = "listen-fire-language", version = "0.12.1", path = "../movement-language" }
movement-engine = { package = "listen-fire-engine", version = "0.12.1", path = "../movement-engine" }
# Adapter protocol 2's envelope, JSON in JavaScript's key order and the
# result checks: shared with the module kit (crates/module-kit).
module-wire = { package = "listen-fire-module-wire", version = "0.12.1", path = "../module-wire", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# As the parser's. `preserve_order` must stay off: features unify across the
# workspace, and the parser's sorted output depends on it being off.
serde_json = { version = "1", features = ["float_roundtrip", "raw_value", "unbounded_depth"], optional = true }
serde_yaml = { version = "0.9", optional = true }
# Objects in insertion order (src/json.rs).
indexmap = { version = "2", optional = true }
# Single-threaded: one host process, one thread, every wait an await.
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "io-std", "net", "time", "signal", "sync"], optional = true }
hyper = { version = "1", features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
# The inbound doors' signature schemes, and a callback id's base64url.
hmac = { version = "0.13", optional = true }
base64 = { version = "0.22", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
# SQLite linked in, so the binary needs no system library.
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
# The run host's Postgres backend (src/pg_store.rs): the hosted product's
# automations tables. Every value crosses as text, so no type features.
tokio-postgres = { version = "0.7", optional = true }
# Random bytes: a callback id (`newCallbackId`), and a sign-in's state and
# PKCE verifier (src/oauth2.rs).
getrandom = { version = "0.4", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
# A park's library text is named by its sha-256 (`parkSources`).
sha2 = { version = "0.11", optional = true }
# The engine's pin: ISO instants written as `Date.toISOString` writes them.
jiff = { version = "=0.2.16", default-features = false, features = ["std"], optional = true }
# HTTPS out (src/anthropic.rs to the model provider, src/http_out.rs to a
# token endpoint): pure-Rust TLS on the system-free root set, so the binary
# still needs no system library.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
webpki-roots = { version = "1", optional = true }
# Secrets (src/oauth2.rs, src/oauth_redirect.rs): URLs parsed and query
# strings written as WHATWG URL / URLSearchParams do, and the random state
# and PKCE verifier of a sign-in.
url = { version = "2", optional = true }
# A PDF's pages and the text its fonts draw (src/pdf_text.rs). Its default
# features are dates and threads lf does not need.
lopdf = { version = "0.42", default-features = false, optional = true }
# The PDF reader child's address-space limit (setrlimit before exec).
libc = { version = "0.2", optional = true }

[dev-dependencies]
# Paused time: a test of the wall clock's grace runs in no time.
tokio = { version = "1", features = ["test-util"] }
# tests/module_host.rs: lf drives crate modules served by a module host.
module-kit = { package = "listen-fire-module-kit", path = "../module-kit" }
rust-module-example = { path = "../../examples/rust-module" }

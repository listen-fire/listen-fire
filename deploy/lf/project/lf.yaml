# The image's default project: mount your own over /srv/lf/project to replace it.
engine: 0.12.6
movements: movements
externals: externals
# Run state is kept by the Postgres store module. Its settings (the URL)
# come from the environment, never this file:
#   LF_SECRET__POSTGRES_STORE__EXTERNAL=@lf/postgres-store
#   LF_SECRET__POSTGRES_STORE__URL=postgres://…?sslmode=verify-full
core:
  store: "@lf/postgres-store"
# Two more slot modules are in the image, off by default. To keep documents in an
# S3-interface bucket and to share rate limits across workers, set:
#   core:
#     store: "@lf/postgres-store"
#     files: s3_files
#     limiter: postgres_limiter
# with their settings from the environment, never this file:
#   LF_SECRET__S3_FILES__EXTERNAL=s3_files
#   LF_SECRET__S3_FILES__BUCKET=… __REGION=… (and __ENDPOINT, __PATH_STYLE,
#   __ACCESS_KEY_ID, __SECRET_ACCESS_KEY as the service needs)
#   LF_SECRET__POSTGRES_LIMITER__EXTERNAL=postgres_limiter
#   LF_SECRET__POSTGRES_LIMITER__URL=postgres://…?sslmode=verify-full
# Models on another vendor than Anthropic, and reading scanned PDFs and images
# (the ocr slot, empty by default: a scanned file is refused, saying so). On
# Gemini, through Google Cloud's own identity where the container has one:
#   core:
#     models: models
#     ocr: document_ai        # Google Document AI, the platform's reader
#     # ocr: models_ocr       # or Gemini reading the file itself
#   LF_SECRET__MODELS__EXTERNAL=models
#   LF_SECRET__MODELS__VENDOR=gemini
#   LF_SECRET__MODELS__GOOGLE_PROJECT=…  (or __API_KEY=… for a Gemini API key)
#   LF_SECRET__DOCUMENT_AI__EXTERNAL=document_ai
#   LF_SECRET__DOCUMENT_AI__PROJECT=… __LOCATION=eu __PROCESSOR_ID=…
#   LF_SECRET__DOCUMENT_AI__BUCKET=…  (files past 15 pages or 20 MB)
#   LF_SECRET__MODELS_OCR__EXTERNAL=models_ocr  (the models settings again, as __VENDOR=gemini, …)
# A wake for workers started on demand (the wake slot, empty by default: nobody
# is told, and work waits for a scheduled `lf drain`). On Cloud Run, with the drain as a job, each row's due
# time becomes a Google Cloud Tasks task that starts the job; keep an hourly
# scheduled drain as the safety net, and give every process the same settings:
#   core:
#     store: "@lf/postgres-store"
#     wake: wake_cloud_tasks
#   LF_SECRET__WAKE_CLOUD_TASKS__EXTERNAL=wake_cloud_tasks
#   LF_SECRET__WAKE_CLOUD_TASKS__QUEUE=projects/…/locations/…/queues/…
#   LF_SECRET__WAKE_CLOUD_TASKS__JOB=projects/…/locations/…/jobs/…
#   LF_SECRET__WAKE_CLOUD_TASKS__INVOKER_SERVICE_ACCOUNT=…@….iam.gserviceaccount.com
#   LF_SECRET__WAKE_CLOUD_TASKS__COALESCE_WINDOW_MS=60000  (optional, the default)
# Credentials shared by every worker, in a vault rather than the environment and
# the secrets file (the secrets slot, `@lf/file-secrets` by default). A module
# of your own fills it; its own settings come from the environment, never
# from the vault it opens:
#   core:
#     store: "@lf/postgres-store"
#     secrets: acme_vault          # externals/acme_vault/lf-external.yaml, kind: core, slot: secrets
#   LF_SECRET__ACME_VAULT__EXTERNAL=acme_vault
#   LF_SECRET__ACME_VAULT__<SETTING>=…   (each setting its manifest declares)
# A token one worker refreshes is kept for all, and two workers refresh it once.
# `LF_SECRET__<CREDENTIAL>__<FIELD>` still lies over what the vault holds.
# The project's movement files kept in a store of your own, one tenant's per
# process (the movements slot, `@lf/folder-movements` by default: the folder
# above). A module of your own fills it; its own settings come from the
# environment, never from the secrets slot:
#   core:
#     store: "@lf/postgres-store"
#     movements: acme_movements    # externals/acme_movements/lf-external.yaml, kind: core, slot: movements, settings: [{ name: tenant }]
#   LF_SECRET__ACME_MOVEMENTS__EXTERNAL=acme_movements
#   LF_SECRET__ACME_MOVEMENTS__TENANT=…   (the team whose movements these are, set per process)
# lf sends the settings on every request and never reads the tenant itself.
# This file and the externals folder stay here, whichever module holds the movements.

# The Postgres limiter (/srv/lf/modules/postgres-limiter), installed in the image,
# so many listen-fire workers share one count. Not the default: name it in lf.yaml
# (core: { limiter: postgres_limiter }) and give it LF_SECRET__POSTGRES_LIMITER__URL.
# Either also needs LF_SECRET__<NAME>__EXTERNAL set to the install's name.
name: postgres_limiter
kind: core
slot: limiter
# Started in this install folder, so the paths are absolute.
command: [node, --conditions=movement-engine-internals, --require, /srv/lf/packages/module-kit/node_modules/tsx/dist/cjs/index.cjs, /srv/lf/modules/postgres-limiter/serve.ts]
settings:
  - { name: url, label: the Postgres connection string, secret: true }
  - { name: schema, label: the schema holding the limiter's tables (default lf_postgres_limiter), secret: false, optional: true }

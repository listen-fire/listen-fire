# A second Postgres, for `smoke.sh`'s external-database shape and nothing else.
#
# It stands in for a managed database: a service the api's own composition did
# not start on its behalf, with `postgres-init/00-roles.sql` run into it the way
# an operator runs that file by hand against RDS or Cloud SQL. The shape sets
# DATABASE_URL to this service, which is the whole switch — the bundled
# `postgres` service then leaves the composition (see docker-compose.yml's
# header) and the migration lands here instead.
#
# No volume: the database is thrown away with the container.
services:
  external-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: listenfire
      POSTGRES_DB: listenfire
      POSTGRES_PASSWORD: smoke
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U listenfire -d listenfire']
      interval: 5s
      timeout: 5s
      retries: 30

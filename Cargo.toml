[workspace]
resolver = "3"
members = ["crates/lf", "crates/module-kit", "crates/module-wire", "crates/movement-checker", "crates/movement-engine", "crates/movement-language", "crates/movement-parser", "examples/rust-embed", "examples/rust-module"]

# The core's one version, the language's: the parser, checker, language and
# engine crates and the `listen-fire` facade (crates/lf, which installs `lf`).
# `scripts/release/sync-core-version.mjs` writes it from movement-lang's
# package.json. module-wire and module-kit carry versions of their own.
[workspace.package]
version = "0.12.6"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/listen-fire/listen-fire"
homepage = "https://github.com/listen-fire/listen-fire"
rust-version = "1.85"

# Debug builds keep line tables only: every test binary carried full debug info,
# and five copies of the 86 MB `lf` test binary sat in one build directory.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# The committed WASM artifact is built with this profile; the CI check
# rebuilds it and compares bytes, so changing it means rebuilding and
# committing the artifact in the same change.
[profile.release]
# "z" over "s": 9% smaller (442,538 vs 486,896 bytes; gzipped 144,698 vs
# 154,904), parity and the shadow-stack band at the depth limit unchanged
# (measured 2026-10-06). The browser downloads and compiles every byte.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

name: typecheck
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  language:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm -r code:type-check


name: lf-release
# A git tag `lf-v<semver>` builds the `listen-fire` binary for macOS (arm64, x64) and
# Linux (x64, arm64; static, musl) and attaches, to a GitHub release of that
# tag, one archive per target plus SHA256SUMS. Each archive carries the binary
# (bin/listen-fire) and the built-in modules (share/lf/modules), so a module runs offline
# after install (it needs node on the machine: modules are TypeScript served by
# serve-module). Nothing runs on a push to a branch, and nothing is published
# anywhere but that release.
#
# A tag with a pre-release suffix (`lf-v0.12.0-rc.1`) makes a GitHub release
# marked pre-release.
#
# The tag's version must be crates/lf's Cargo version (`listen-fire --version` prints
# it); a tag that disagrees fails before anything is built.
#
# `workflow_dispatch` builds the same matrix against any ref and uploads the
# archives as workflow artifacts only: how a change to this file is proved
# before it is tagged.
on:
  push:
    tags:
      - "lf-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (dry run — builds every target, publishes nothing)"
        required: false
        default: ""

concurrency:
  group: lf-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The workspace's release profile is tuned for the WASM artifacts
  # (opt-level "z"); the native host wants speed.
  CARGO_PROFILE_RELEASE_OPT_LEVEL: "3"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-14, os: darwin, cpu: arm64, libc: "" }
          - { target: x86_64-apple-darwin, runner: macos-14, os: darwin, cpu: x64, libc: "" }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, os: linux, cpu: x64, libc: glibc, zig: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-latest, os: linux, cpu: arm64, libc: glibc, zig: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The tag names the crate's version
        # `listen-fire --version` prints crates/lf's Cargo version, so a release whose
        # tag disagrees with it would ship a binary that misreports itself.
        if: startsWith(github.ref, 'refs/tags/lf-v')
        run: |
          crate="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "listen-fire") | .version')"
          tag="${GITHUB_REF_NAME#lf-v}"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME names $tag, but crates/lf/Cargo.toml is $crate: set the crate's version and tag again"
            exit 1
          fi
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Zig (cross-linking musl)
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: cargo-zigbuild
        if: matrix.zig
        run: cargo install cargo-zigbuild --locked --version 0.23.4
      - name: Build listen-fire
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release --locked -p listen-fire --target ${{ matrix.target }}
          else
            cargo build --release --locked -p listen-fire --target ${{ matrix.target }}
          fi
      - name: Smoke test (a binary that runs on this runner)
        if: "!matrix.zig && matrix.target == 'aarch64-apple-darwin'"
        run: |
          bin=target/${{ matrix.target }}/release/listen-fire
          "$bin" --version
          "$bin" init "$RUNNER_TEMP/starter"
          "$bin" check --dir "$RUNNER_TEMP/starter"
      - name: Archive
        id: archive
        run: |
          version="${GITHUB_REF_NAME:-dry-run}"
          name="${version}-${{ matrix.target }}"
          mkdir -p "dist/$name/bin" "dist/$name/share/lf"
          cp "target/${{ matrix.target }}/release/listen-fire" "dist/$name/bin/listen-fire"
          node scripts/dist/build-modules-bundle.mjs "dist/$name/share/lf/modules" ${{ matrix.os }} ${{ matrix.cpu }} ${{ matrix.libc }}
          rm -f "dist/$name/share/lf/modules/package-lock.json"
          cp LICENSE NOTICE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "archive=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lf-${{ matrix.target }}
          path: ${{ steps.archive.outputs.archive }}
          if-no-files-found: error

  release:
    # Tag pushes only: a dry run stops after the archives exist.
    if: startsWith(github.ref, 'refs/tags/lf-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum lf-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/lf-*.tar.gz artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "listen-fire ${GITHUB_REF_NAME#lf-v}" --generate-notes \
            $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease ;; esac)

  homebrew:
    # Pre-releases bump the tap too: it serves whatever the newest release is.
    if: startsWith(github.ref, 'refs/tags/lf-v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `secrets` cannot be read in a job-level `if`, so the first step turns
      # its presence into an output the later steps test.
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Tap token present
        id: token
        run: |
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap was not bumped"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
        with:
          repository: listen-fire/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render the formula
        if: steps.token.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # The whole formula is generated here, in the shape of
        # deploy/homebrew/listen-fire.rb, rather than edited by line number or pattern:
        # each hash is looked up by its tarball's name in SHA256SUMS.
        run: |
          version="${GITHUB_REF_NAME#lf-v}"
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --repo "$GITHUB_REPOSITORY"
          sha() {
            hash="$(awk -v f="lf-v${version}-$1.tar.gz" '$2 == f { print $1 }' SHA256SUMS)"
            if [ -z "$hash" ]; then
              echo "::error::SHA256SUMS has no entry for lf-v${version}-$1.tar.gz"
              exit 1
            fi
            echo "$hash"
          }
          base="https://github.com/listen-fire/listen-fire/releases/download/${GITHUB_REF_NAME}/${GITHUB_REF_NAME}"
          mac_arm="$(sha aarch64-apple-darwin)"
          mac_intel="$(sha x86_64-apple-darwin)"
          linux_arm="$(sha aarch64-unknown-linux-musl)"
          linux_intel="$(sha x86_64-unknown-linux-musl)"
          mkdir -p tap/Formula
          cat > tap/Formula/listen-fire.rb <<RUBY
          class ListenFire < Formula
            desc "Listen-Fire: the movement language and its local runner"
            homepage "https://github.com/listen-fire/listen-fire"
            version "${version}"
            license "Apache-2.0"

            # The built-in modules are TypeScript and need Node once a system is connected.
            depends_on "node"

            on_macos do
              on_arm do
                url "${base}-aarch64-apple-darwin.tar.gz"
                sha256 "${mac_arm}"
              end
              on_intel do
                url "${base}-x86_64-apple-darwin.tar.gz"
                sha256 "${mac_intel}"
              end
            end

            on_linux do
              on_arm do
                url "${base}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${linux_arm}"
              end
              on_intel do
                url "${base}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${linux_intel}"
              end
            end

            def install
              # bin/ and share/ stay together: listen-fire finds its modules at <prefix>/share/lf/modules.
              prefix.install Dir["*"]
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/listen-fire --version")
            end
          end
          RUBY
      - name: Commit and push the tap
        if: steps.token.outputs.ready == 'true'
        run: |
          cd tap
          if git diff --quiet -- Formula/listen-fire.rb && [ -z "$(git ls-files --others --exclude-standard Formula)" ]; then
            echo "Formula/listen-fire.rb is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/listen-fire.rb
          git commit -m "listen-fire ${GITHUB_REF_NAME#lf-v}"
          git push

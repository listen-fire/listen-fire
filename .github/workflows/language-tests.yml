name: language-tests
# The language's own proof: the import boundaries, the typecheck and the
# package test sets. The Rust crates' tests and the wasm check are in
# movement-wasm.yml.
on:
  pull_request:
    paths:
      - "packages/**"
      - "modules/**"
      - "apps/cli/**"
      - "crates/**"
      - "scripts/**"
      - "jest.config.base.cjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/language-tests.yml"
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "modules/**"
      - "apps/cli/**"
      - "crates/**"
      - "scripts/**"
      - "jest.config.base.cjs"
      - "pnpm-lock.yaml"
      - ".github/workflows/language-tests.yml"

permissions:
  contents: read

jobs:
  language:
    timeout-minutes: 25
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: "pnpm"
      - run: corepack pnpm install --frozen-lockfile
      - name: Module boundary
        run: node scripts/check-module-boundary.cjs
      - name: Engine boundary
        run: node scripts/check-engine-boundary.cjs
      - name: Typecheck
        run: corepack pnpm -r code:type-check
      - name: engine-contracts tests
        run: corepack pnpm --filter @listen-fire/engine-contracts test
      - name: movement-lang tests
        run: corepack pnpm --filter @listen-fire/movement-lang test
      - name: Engine tests
        run: corepack pnpm --filter @listen-fire/engine test
      - name: Handbook tests
        run: corepack pnpm --filter @listen-fire/handbook test
      - name: module-kit tests
        run: corepack pnpm --filter @listen-fire/module-kit test
      - name: gmail tests
        run: corepack pnpm --filter './modules/gmail' test
      - name: slack tests
        run: corepack pnpm --filter './modules/slack' test
      - name: affinity tests
        run: corepack pnpm --filter './modules/affinity' test
